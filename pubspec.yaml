name: ai_book_recommendation_app
description: AI-powered book recommendation and review app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  cupertino_icons: ^1.0.5
  provider: ^6.0.5
  uuid: ^3.0.7
  intl: ^0.18.1
  http: ^1.1.0
  shared_preferences: ^2.2.0

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.1.0

  # UI enhancement
  cached_network_image: ^3.2.3
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/